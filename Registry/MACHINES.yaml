superbrain_definition:
  per_user_architecture: "SuperBrain = ULTRA-MAERA-2 + SPARK-AGAVE-3 + SPARK-AGAVE-4 三機整體"
  per_repo_2agave128-1maera64: "repo 自稱 SuperBrain，且確實描述三機協同——這一點與使用者定義一致"
  discrepancy: "repo 內定義的 SuperBrain 是一個獨立於 AIECP/AERIS/MEGIS 的通用個人任務調度系統（語音助理 + 多機批次運算），並未涵蓋『承載 AERIS/MEGIS/AIECP 領域服務』這件事。因此雖然機器命名一致，SuperBrain 的職責範圍是否等於使用者設想的『整個 compute fabric』仍待釐清，見 Blueprint/09。"
